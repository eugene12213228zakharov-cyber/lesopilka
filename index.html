<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Лесопилка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #bfe3f2;
  --card: #ffffff;
  --ink: #23303b;
  --muted: #6b7885;
  --line: #e3e8ee;
  --accent: #f5b400;
  --accent-ink: #3a2a00;
  --good: #2f9e54;
  --bad: #d64533;
  --shadow: 0 6px 18px rgba(20, 40, 60, 0.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --card: #1f2830; --ink: #e8eef3; --muted: #9aa8b4; --line: #33414d; --shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  }
}
:root[data-theme="dark"] { --card: #1f2830; --ink: #e8eef3; --muted: #9aa8b4; --line: #33414d; --shadow: 0 6px 18px rgba(0, 0, 0, 0.45); }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: Nunito, 'Segoe UI', system-ui, sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#c:active { cursor: grabbing; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; transition: opacity 0.3s; }
#labels.hide { opacity: 0; }
button { font: inherit; cursor: pointer; }

/* подписи над объектами */
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none; will-change: transform; }
.lbl.pad { background: rgba(255,255,255,0.95); color: #23303b; border-radius: 10px; padding: 4px 9px 5px; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,0.18); border: 2px solid #f5b400; }
.lbl.pad.gate { border-color: #e0503c; }
.lbl.pad .t { font-size: 12px; font-weight: 800; }
.lbl.pad .i { font-size: 11px; font-weight: 700; color: #5d6a75; }
.lbl.pad .c { font-size: 15px; font-weight: 900; color: #b0662a; }
/* над рабочим: номер из списка и чего ждёт */
.lbl.wtag { display: flex; align-items: center; gap: 5px; background: rgba(35,48,59,0.86); color: #fff; font-size: 11px; font-weight: 800; border-radius: 9px; padding: 2px 7px 2px 3px; white-space: normal; max-width: 210px; width: max-content; line-height: 1.25; }
.lbl.wtag:not(.idle) { padding-right: 3px; }
.lbl.wtag b { background: #ffd43b; color: #3a2a00; border-radius: 6px; padding: 0 5px; font-weight: 900; }
.lbl.wtag.hl { box-shadow: 0 0 0 2px #35d0ff; }
.lbl.wtag.idle:not(:has(b)) { padding-left: 7px; }
.lbl.wtag .ws { display: none; }   /* короткая причина — только на телефоне */
.lbl.pad .c.ok { color: #2f9e54; }
.lbl.info { background: rgba(255,255,255,0.94); color: #23303b; border-radius: 10px; padding: 6px 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.18); font-size: 12px; font-weight: 700; border: 2px solid #f08a24; }
.lbl.info .t { font-weight: 900; font-size: 13px; margin-bottom: 2px; }
.lbl .row.done { color: #2f9e54; }
.lbl.zone { background: rgba(35,48,59,0.85); color: #fff; border-radius: 10px; padding: 6px 12px; text-align: center; font-size: 12px; }
.lbl.zone .t { font-weight: 900; font-size: 14px; }
.lbl.cnt { background: rgba(35,48,59,0.8); color: #fff; font-size: 11px; font-weight: 800; border-radius: 8px; padding: 1px 7px; transform-origin: center; }
.lbl.cnt.full { background: #d64533; }
.lbl.money { background: #ffd43b; color: #3a2a00; font-weight: 900; font-size: 13px; border-radius: 9px; padding: 2px 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
.lbl.station { background: rgba(255,255,255,0.85); color: #23303b; border-radius: 8px; padding: 3px 8px; font-size: 11px; text-align: center; opacity: 0.92; }
.lbl.station .t { font-weight: 900; }
.float { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 18px; color: #2f9e54; text-shadow: 0 2px 0 #fff, 0 0 6px #fff; animation: rise 1.1s ease-out forwards; pointer-events: none; }
@keyframes rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -60px; } }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#money { position: absolute; left: 16px; top: 14px; background: var(--card); border-radius: 16px; padding: 8px 16px 8px 12px; box-shadow: var(--shadow); min-width: 150px; }
#money .big { font-size: 28px; font-weight: 900; line-height: 1.1; display: flex; align-items: center; gap: 6px; }
#money .sub { font-size: 12px; font-weight: 800; color: var(--good); }
#money .sub2 { font-size: 11px; font-weight: 700; color: var(--muted); }
#money.bump .big { animation: bump 0.25s ease-out; }
@keyframes bump { 50% { transform: scale(1.08); } }
#floorChip { position: absolute; left: 16px; top: 104px; background: var(--card); border-radius: 12px; padding: 5px 12px; box-shadow: var(--shadow); font-size: 13px; font-weight: 700; cursor: pointer; }
#floorChip.hot { background: var(--accent); color: var(--accent-ink); }   /* жилец не выбран */
/* жильцы небоскрёба: две карточки на выбор */
.tenants { display: flex; gap: 10px; margin: 10px 0; }
.tenant { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 2px solid var(--line); border-radius: 14px; padding: 12px 8px; background: var(--card); color: var(--ink); font-size: 13px; text-align: center; }
.tenant:hover { border-color: var(--accent); }
.tenant .ti { font-size: 30px; line-height: 1.1; }
.tenant b { font-size: 14px; }
.tenant span:last-child { color: var(--muted); font-size: 12px; font-weight: 700; }
#modal .tenant { margin: 0; background: var(--card); color: var(--ink); border: 2px solid var(--line); padding: 12px 8px; font-weight: 700; }
#modal .tenant:hover { border-color: var(--accent); }
/* корабль: сколько ждёт и что везти */
#shipCard { position: absolute; left: 16px; top: 144px; background: var(--card); border-radius: 12px; padding: 7px 12px; box-shadow: var(--shadow); font-size: 12px; font-weight: 700; min-width: 210px; pointer-events: none; }
#shipCard .st { font-size: 13px; }
#shipCard .st.warn b { color: var(--bad); }
#shipCard .row { display: flex; justify-content: space-between; gap: 12px; margin-top: 3px; }
#shipCard .row.done { color: var(--good); }
#shipCard .row i { font-style: normal; color: var(--muted); font-size: 11px; }
#shipCard .rw { margin-top: 4px; color: var(--muted); }
#goal { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: #fff6cf; color: #3a2a00; border: 2px solid #f5c542; border-radius: 14px; padding: 8px 16px; font-weight: 800; font-size: 15px; box-shadow: var(--shadow); max-width: min(560px, calc(100vw - 460px)); text-align: center; }
#btns { position: absolute; right: 16px; top: 14px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 50vw; }
#btns button { background: var(--card); color: var(--ink); border: 0; border-radius: 12px; padding: 9px 13px; font-weight: 800; font-size: 14px; box-shadow: var(--shadow); }
#btns button:hover { filter: brightness(0.96); }
#btns button.hot { background: var(--accent); color: var(--accent-ink); }
.badge { display: inline-block; min-width: 18px; margin-left: 5px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
kbd { font-family: inherit; font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 3px; }
#carry { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: rgba(35,48,59,0.85); color: #fff; border-radius: 12px; padding: 6px 14px; font-weight: 800; font-size: 13px; }

/* панель */
#panel { position: fixed; right: 16px; top: 64px; bottom: 16px; width: 390px; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
#panel.hidden { display: none; }
.ph { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.ph h2 { margin: 0; font-size: 18px; font-weight: 900; }
.ph button { border: 0; background: transparent; color: var(--muted); font-size: 18px; }
#pBody { overflow-y: auto; padding: 6px 16px 16px; user-select: text; }
.sec { font-weight: 900; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 14px 0 6px; }
.urow, .wrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.wrow { gap: 8px; }
.wrow .wn { flex: none; min-width: 26px; text-align: center; font-weight: 900; font-size: 13px; border: 2px solid; border-radius: 8px; padding: 1px 3px; }
.wrow.idle .vv { color: #b0662a; }
.wrow .show { border: 0; border-radius: 10px; padding: 7px 8px; background: var(--line); }
/* закупка брёвен: − число + */
.urow.order b { min-width: 34px; text-align: center; font-size: 16px; font-weight: 900; }
.urow.order .step { border: 0; border-radius: 10px; width: 36px; height: 34px; font-size: 18px; font-weight: 900; background: var(--accent); color: var(--accent-ink); }
.sec .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.un { flex: 1; min-width: 0; }
.nm { font-weight: 800; font-size: 14px; }
.lv { font-size: 11px; color: var(--accent); letter-spacing: 1px; }
.lv span { color: var(--line); }
.vv { font-size: 12px; color: var(--muted); font-weight: 700; }
.buy, .tog { border: 0; border-radius: 10px; padding: 8px 10px; min-width: 88px; font-weight: 900; background: var(--line); color: var(--muted); }
.buy.ok { background: var(--accent); color: var(--accent-ink); }
.buy:disabled { cursor: default; }
.tog { background: #e8f5ec; color: var(--good); }
.tog.off { background: #fbe9e7; color: var(--bad); }
.note { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 8px 0; }
.note.small { font-size: 12px; }
.need { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 8px 0; font-weight: 800; font-size: 14px; }
.bar { grid-column: 1 / -1; height: 8px; background: var(--line); border-radius: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #f39c33, #f5c542); }
.floors { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.fl { border: 1px solid var(--line); border-radius: 8px; padding: 4px; text-align: center; font-size: 12px; color: var(--muted); }
.fl b { display: block; font-size: 14px; color: var(--ink); }
.fl span { font-size: 10px; }
.fl.done { background: #e8f5ec; border-color: #bfe3cb; }
.fl.cur { border: 2px solid var(--accent); }
.chk { display: flex; gap: 8px; font-size: 13px; font-weight: 700; margin: 10px 0; align-items: flex-start; }
.wide { display: block; width: 100%; margin: 8px 0; border: 0; border-radius: 12px; padding: 10px; font-weight: 800; background: var(--line); color: var(--ink); }
.danger { background: #fbe9e7 !important; color: var(--bad) !important; }

/* админка тестовой версии */
#adminBtn { position: absolute; left: 16px; bottom: 16px; background: #d64533; color: #fff; border: 0; border-radius: 10px; padding: 5px 10px; font-weight: 900; font-size: 12px; box-shadow: var(--shadow); }
#admin { position: fixed; left: 16px; bottom: 52px; width: 300px; max-height: calc(100vh - 260px); overflow-y: auto; background: rgba(24,30,36,0.94); color: #eef3f7; border-radius: 14px; padding: 10px 12px 12px; box-shadow: var(--shadow); font-size: 13px; }
#admin.hidden { display: none; }
#admin .ah { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
#admin .ah button { background: transparent; border: 0; color: #9aa8b4; font-size: 16px; }
#admin .as { color: #9aa8b4; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; margin: 10px 0 5px; }
#admin .ag { display: flex; flex-wrap: wrap; gap: 5px; }
#admin .ag button { background: #33414d; color: #eef3f7; border: 0; border-radius: 8px; padding: 6px 8px; font-weight: 800; font-size: 12px; }
#admin .ag button:hover { background: #3f505e; }
#admin .ag button.on { background: #2f9e54; }
#admin .ag button.bad { background: #8e2b20; }
#admin .an { color: #9aa8b4; font-size: 11px; margin-top: 10px; }
#fps { position: fixed; left: 50%; bottom: 4px; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: #fff; font: 700 11px ui-monospace, Consolas, monospace; padding: 2px 8px; border-radius: 6px; pointer-events: none; }

/* сообщения и окна */
#toasts { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { background: var(--card); color: var(--ink); border-radius: 12px; padding: 8px 16px; box-shadow: var(--shadow); font-weight: 700; font-size: 14px; text-align: center; animation: tin 0.25s ease-out; transition: opacity 0.5s, transform 0.5s; }
.toast.big { border: 2px solid var(--accent); font-size: 16px; }
.toast.bad { border: 2px solid var(--bad); }
.toast.out { opacity: 0; transform: translateY(10px); }
@keyframes tin { from { opacity: 0; transform: translateY(12px); } }
#modal { position: fixed; inset: 0; background: rgba(20,30,40,0.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal.hidden { display: none; }
#modal .box { background: var(--card); border-radius: 18px; padding: 20px 24px; max-width: 420px; width: 100%; box-shadow: var(--shadow); text-align: center; }
#modal h2 { margin: 0 0 8px; font-weight: 900; }
#modal p { margin: 8px 0; line-height: 1.45; }
#modal .big { font-size: 30px; font-weight: 900; color: var(--good); }
#modal .small { font-size: 13px; color: var(--muted); }
#modal button { border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 900; background: var(--accent); color: var(--accent-ink); margin-top: 8px; }
#modal textarea { width: 100%; height: 110px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-family: ui-monospace, Consolas, monospace; font-size: 11px; padding: 8px; user-select: text; }
/* окно «Идея или баг» */
#modal .fb { text-align: left; }
#modal .fb textarea { height: 120px; font-family: inherit; font-size: 14px; resize: vertical; }
#modal .fb input[type=text], #modal .fb input:not([type]) { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 14px; padding: 8px; margin-top: 6px; user-select: text; }
#modal .fbk { display: flex; gap: 6px; margin: 6px 0 8px; }
#modal .fbk button { flex: 1; margin: 0; background: var(--line); color: var(--ink); padding: 8px 6px; font-size: 13px; }
#modal .fbk button.on { background: var(--accent); color: var(--accent-ink); }
/* казино: зал на 8-м этаже — панель ставки у места игры, затемнение при входе, заголовок зала */
#csDock { position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%); width: min(440px, calc(100vw - 24px)); background: var(--card); color: var(--ink); border-radius: 16px; box-shadow: var(--shadow); padding: 10px 12px; z-index: 6; text-align: center; }
#csDock.hidden { display: none; }
#csDock .cs-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
#csDock .cs-row { display: flex; gap: 6px; margin: 6px 0; }
#csDock .cs-row button { flex: 1; border: 0; border-radius: 10px; padding: 7px 4px; font-weight: 800; font-size: 13px; background: var(--line); color: var(--ink); }
#csDock .cs-row button.on { background: var(--accent); color: var(--accent-ink); }
#csDock .cs-row button:disabled { opacity: 0.45; }
#csDock .cs-row.runners button { font-size: 12px; line-height: 1.25; padding: 5px 2px; }
#csDock .cs-go { width: 100%; border: 0; border-radius: 12px; padding: 10px; font-weight: 900; font-size: 16px; background: var(--accent); color: var(--accent-ink); }
#csDock .cs-go:disabled { opacity: 0.5; }
#csDock .cs-res { min-height: 22px; font-weight: 900; font-size: 15px; margin-top: 6px; }
#csDock .cs-res .win { color: var(--good); }
#csDock .cs-stat { font-size: 11px; color: var(--muted); }
#roomTitle { position: absolute; left: 50%; top: 62px; transform: translateX(-50%); background: rgba(35,20,24,0.88); color: #ffd84a; border-radius: 12px; padding: 6px 14px; font-weight: 900; font-size: 14px; pointer-events: none; white-space: nowrap; }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.35s; z-index: 40; }
#fade.on { opacity: 1; transition: none; }
body.inroom #goal, body.inroom #shipCard, body.inroom #carry { display: none !important; }
.lbl.station.on { box-shadow: 0 0 0 2px #f5b400; }
#modal button.ghost { background: var(--line); color: var(--ink); }
#modal .fb .chk { font-size: 12px; color: var(--muted); }

#joy { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; background: rgba(255,255,255,0.18); border: 3px solid rgba(255,255,255,0.55); pointer-events: none; }
#joy.hidden { display: none; }
#joyKnob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.8); box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; background: var(--bg); color: #23303b; text-align: center; padding: 16px; }

@media (max-width: 1180px) {
  #goal { top: 66px; max-width: min(520px, calc(100vw - 32px)); }
}
@media (max-width: 760px) {
  #roomTitle { display: none !important; }   /* на телефоне и так видно, где ты: место нужнее */
  #goal { top: auto; bottom: 76px; max-width: calc(100vw - 32px); font-size: 13px; }   /* над кнопками, а не под ними */
  #btns { top: auto; bottom: 14px; right: 50%; transform: translateX(50%); max-width: none; flex-wrap: nowrap; }
  #btns button { padding: 8px 10px; font-size: 13px; }
  #bFb { display: none; }   /* на телефоне — в Меню, иначе кнопки не влезают */
  /* подписи мельче: на узком экране они закрывали полэкрана; над рабочим — коротко, «что даст» — только у ближней площадки */
  .lbl.pad { padding: 2px 6px 3px; border-width: 1.5px; border-radius: 8px; }
  .lbl.pad .t { font-size: 10px; }
  .lbl.pad .c { font-size: 12px; }
  .lbl.pad .i { font-size: 9px; }
  .lbl.pad:not(.near) .i { display: none; }
  .lbl.station { font-size: 9px; padding: 2px 6px; }
  .lbl.info { font-size: 10px; padding: 4px 7px; }
  .lbl.info .t { font-size: 11px; }
  .lbl.zone { font-size: 10px; padding: 4px 8px; }
  .lbl.zone .t { font-size: 12px; }
  .lbl.cnt { font-size: 9px; padding: 0 5px; }
  .lbl.money { font-size: 11px; padding: 1px 6px; }
  .lbl.wtag { font-size: 9px; max-width: 120px; padding: 1px 5px 1px 2px; gap: 3px; }
  .lbl.wtag .wf { display: none; }
  .lbl.wtag .ws { display: inline; }
  kbd { display: none; }
  #carry { bottom: auto; top: 150px; left: auto; right: 12px; transform: none; }   /* что в руках — справа сверху, не под баннером цели */
  #shipCard { min-width: 0; max-width: calc(100vw - 32px); font-size: 11px; }
  #adminBtn { bottom: auto; top: 104px; left: auto; right: 16px; }
  #admin { bottom: auto; top: 140px; }
  #panel { left: 8px; right: 8px; width: auto; top: 8px; bottom: 70px; }
  #money .big { font-size: 22px; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="hud">
  <div id="money"><div class="big">💰 <span id="moneyV">$0</span></div><div class="sub" id="rate">+$0/мин</div><div class="sub2" id="cashHint"></div></div>
  <div id="floorChip" onclick="document.getElementById('bTower').click()">🏢 <span id="floorV">Этаж 0/20</span></div>
  <div id="shipCard" style="display:none"></div>
  <div id="goal" style="display:none"></div>
  <div id="roomTitle" style="display:none">🎰 Казино «Золотой топор» · 8-й этаж</div>
  <div id="btns">
    <button id="bUpg">⬆ Улучшения<span id="upgBadge" class="badge" style="display:none"></span><kbd>U</kbd></button>
    <button id="bTower">🏢 Небоскрёб<kbd>B</kbd></button>
    <button id="bWork">👷 Рабочие<kbd>R</kbd></button>
    <button id="bFb" title="Идея или баг — напиши разработчику">💬</button>
    <button id="bMenu" title="Меню">⚙</button>
  </div>
  <div id="carry" style="display:none"></div>
</div>

<div id="loading">🪵 Лесопилка загружается…</div>

<script>
  // Номер сборки: меняется при каждом обновлении, чтобы браузер не смешал старые и новые файлы
  window.LESO_BUILD = '2026.10.01-1';
  // Тестовая сборка: адрес …/lesopilka-test/ или локальный сервер — своё сохранение и админка F2
  window.LESO_TEST = /lesopilka-test/.test(location.pathname) || ['localhost', '127.0.0.1'].indexOf(location.hostname) >= 0;
  // последние ошибки — прикладываются к сообщению о баге (кнопка «💬»)
  window.__errs = [];
  const keepErr = (t) => { window.__errs.push(new Date().toTimeString().slice(0, 8) + ' ' + String(t).slice(0, 300)); if (window.__errs.length > 8) window.__errs.shift(); };
  window.addEventListener('error', (e) => keepErr((e.message || 'ошибка') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')));
  window.addEventListener('unhandledrejection', (e) => keepErr('promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));
  // если three.js не загрузился с CDN — скажем об этом, а не будем молча висеть
  setTimeout(function () {
    var l = document.getElementById('loading');
    if (l && !window.THREE) l.textContent = 'Не удалось загрузить графику (three.js с unpkg.com). Нужен интернет — проверь подключение и обнови страницу.';
  }, 12000);
</script>
<script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
  window.THREE = THREE;
  window.GLTFLoader = GLTFLoader;
  window.SkeletonUtils = SkeletonUtils;
  const files = ['util', 'config', 'nav', 'sim', 'bot', 'models', 'look', 'craft', 'assets', 'kmodels', 'render', 'room', 'ui', 'input', 'audio', 'admin', 'main'];
  const load = (f) => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'src/' + f + '.js?v=' + window.LESO_BUILD;
    s.onload = res;
    s.onerror = () => rej(new Error(f + '.js'));
    document.body.appendChild(s);
  });
  (async () => { for (const f of files) await load(f); })().catch((e) => {
    document.getElementById('loading').textContent = 'Ошибка загрузки: ' + e.message;
  });
</script>
